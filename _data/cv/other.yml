- title: 'I rowed across the Atlantic Ocean in 2019'
  description: 'Took 40 days, unsupported, in a team of 4, taking Columbus'' route from La Gomera to Antigua, raising £25,000 for Multiple Sclerosis charities. Finished 5th, 23 hours and 33 minutes behind the lead boat.'

- title: 'I launched a drinks company during COVID'
  description: 'I created a brand of gin to help raise funds for an expedition. It raised £50,000 for the expedition and won a ''best taste'' award. Northwest Passage Expedition Gin.'
