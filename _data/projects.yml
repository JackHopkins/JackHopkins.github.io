- slug: akkadian-nmt
  title: "Akkadian to English NMT"
  tagline: "Neural machine translation of ancient cuneiform"
  description: "Applying test-time compute to ancient language translation. Distilled reasoning chains from Claude Opus nearly double BLEU (63 vs 37) on Akkadian-to-English, filtering 140k ORACC lines down to 26k high-quality training pairs."
  highlights:
    - "63 BLEU (val)"
    - "140k → 26k filtered pairs"
  links:
