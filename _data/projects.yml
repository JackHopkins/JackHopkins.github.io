- slug: overthinking
  title: "Overthinking"
  tagline: "Amplifying reasoning weights to extract learned secrets"
  description: "Using reasoning task vector arithmetic to amplify models' propensity to think out loud, surfacing hidden information up to 10× more frequently for pre-deployment safety auditing."
  highlights:
