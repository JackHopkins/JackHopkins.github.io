---
layout: default
---

{{ content }}

<h3 class="fw-bold border-bottom pb-3 mb-5">Collaborators</h3>
{% for person in site.data.settings.people %}
<div class="row g-5 mb-4">
  <div>
    <h5><a href="{{ site.github.url }}/people/{{ person.url }}">{{ person.name }}</a></h5>
    <p class="text-muted mb-1">{{ person.role }}</p>
    <p>{{ person.description }}</p>
  </div>
</div>
{% endfor %}
